<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171018">
<title>ok hola uwuwu ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Pacifico&display=swap');

:root{
 --bg:#120d13;
 --bg2:#1d121d;
 --pink:#ff91c7;
 --pink2:#ffc7e4;
 --pink3:#ffdff0;
 --white:#fff5fb;
 --muted:#e5cdda;
 --card:rgba(35,20,32,.78);
}
*{box-sizing:border-box}
html{min-height:100%}
body{
 margin:0; min-height:100vh; padding:28px 16px;
 display:grid; place-items:center; overflow-x:hidden;
 color:var(--white);
 font-family:"Comfortaa",system-ui,sans-serif;
 background:
 radial-gradient(circle at 50% 20%,rgba(255,145,199,.12),transparent 28%),
 radial-gradient(circle at 15% 80%,rgba(255,190,225,.08),transparent 24%),
 radial-gradient(circle at 85% 75%,rgba(255,145,199,.07),transparent 24%),
 linear-gradient(145deg,var(--bg),var(--bg2) 52%,#0e0a0f);
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:
 radial-gradient(#fff 1px,transparent 1px),
 radial-gradient(#ffafd4 1px,transparent 1px);
 background-size:42px 42px,67px 67px;
 background-position:5px 12px,24px 32px;
}
main{width:min(790px,100%);position:relative;z-index:2;text-align:center}
.ribbon{
 width:95px;height:32px;margin:0 auto 17px;position:relative;
 display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:12px;font-weight:700;
 background:var(--pink);border-radius:7px;
 box-shadow:0 7px 22px rgba(255,145,199,.2);
}
.ribbon:before,.ribbon:after{
 content:"";position:absolute;top:0;width:34px;height:38px;
 background:var(--pink);z-index:-1;
}
.ribbon:before{left:-24px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.ribbon:after{right:-24px;clip-path:polygon(0 0,100% 50%,0 100%)}
h1{
 margin:0 0 15px;color:var(--pink2);
 font-family:"Pacifico",cursive;font-weight:400;
 font-size:clamp(2.8rem,10vw,5.2rem);
 line-height:1.12;text-shadow:0 4px 22px rgba(255,145,199,.16);
}
.subtitle{
 margin:0 auto 27px;color:var(--muted);
 font-size:clamp(.92rem,2.7vw,1.08rem);line-height:1.7;
}
.card{
 position:relative;padding:34px 25px 27px;
 border:1.5px solid rgba(255,145,199,.75);
 border-radius:30px;background:var(--card);
 box-shadow:0 22px 65px rgba(0,0,0,.35),inset 0 0 35px rgba(255,145,199,.025);
 backdrop-filter:blur(8px);
}
.card:before,.card:after{
 position:absolute;color:var(--pink);font-size:25px;opacity:.8;
}
.card:before{content:"♡";left:18px;top:14px}
.card:after{content:"✧";right:19px;bottom:13px}
.heart{
 display:inline-grid;place-items:center;width:47px;height:47px;
 margin-bottom:16px;border-radius:50%;
 color:var(--pink);font-size:25px;
 background:rgba(255,145,199,.08);
 animation:float 2.7s ease-in-out infinite;
}
#message{
 margin:0 auto;color:var(--white);max-width:670px;
 font-size:clamp(1rem,2.7vw,1.17rem);line-height:1.85;
 white-space:pre-line;
 animation:appear .32s ease;
}
.options{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;margin:28px auto 0;max-width:650px;
}
button{
 min-height:67px;padding:15px 16px;
 border:1.5px solid var(--pink);
 border-radius:19px;background:rgba(255,145,199,.055);
 color:var(--pink3);font-family:"Comfortaa",sans-serif;
 font-size:.96rem;font-weight:600;line-height:1.35;
 cursor:pointer;box-shadow:0 5px 0 rgba(255,145,199,.08);
 transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
button:before{content:"♡ ";color:var(--pink)}
button:hover,button:focus-visible{
 background:rgba(255,145,199,.15);transform:translateY(-3px);
 box-shadow:0 9px 24px rgba(255,145,199,.12),0 3px 0 rgba(255,145,199,.12);
 outline:none;
}
button:active{transform:translateY(0)}
.footer{
 margin:18px 0 0;color:#a98d9f;font-size:.74rem;
 letter-spacing:.04em;
}
.float{
 position:fixed;z-index:1;color:var(--pink);pointer-events:none;
 opacity:.72;user-select:none;animation:drift 5s ease-in-out infinite;
}
.f1{top:8%;left:7%;font-size:37px;transform:rotate(-15deg)}
.f2{top:16%;right:7%;font-size:31px;animation-delay:.7s}
.f3{bottom:11%;left:6%;font-size:43px;animation-delay:1.2s}
.f4{bottom:9%;right:7%;font-size:32px;animation-delay:1.8s}
.f5{top:52%;left:3%;font-size:20px;animation-delay:2.1s}
.f6{top:57%;right:3%;font-size:19px;animation-delay:1.4s}
@keyframes float{50%{transform:translateY(-5px) scale(1.03)}}
@keyframes drift{50%{transform:translateY(-9px) rotate(5deg)}}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:560px){
 body{padding:20px 12px}
 .card{padding:29px 16px 23px;border-radius:25px}
 .options{grid-template-columns:1fr;gap:11px}
 button{min-height:59px}
 .f1{left:2%;top:3%}.f2{right:2%;top:5%}
 .f3{left:2%;bottom:3%}.f4{right:2%;bottom:3%}
 .f5,.f6{display:none}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="float f1">♡</div>
<div class="float f2">✧</div>
<div class="float f3">୨୧</div>
<div class="float f4">♡</div>
<div class="float f5">✦</div>
<div class="float f6">♡</div>

<main>
 <div class="ribbon"> ♡</div>
 <h1 id="title">ok hola uwuwu</h1>
 <p class="subtitle" id="subtitle">elige una opción y veamos qué pasa… ♡</p>

 <section class="card">
 <div class="heart" id="heart">♡</div>
 <p id="message"></p>
 <div class="options" id="options"></div>
 </section>

 <div class="footer"> ୨୧</div>
</main>

<script>
const screens={
 inicio:{
 title:"ok hola uwuwu",
 subtitle:"elige una opción y veamos qué pasa… ♡",
 message:"",
 options:[["no me molestes","no"],["hola","hola"]]
 },
 no:{title:"",subtitle:"",message:"ok puto",options:[]},
 hola:{

 options:[["ok a ver dime","teoria"],["we que asco me das alchile pa","asco"]]
 },
 asco:{title:"",subtitle:"",message:"bueno:( perdon",options:[]},
 teoria:{

 options:[["seguir leyendo","seguir"],[":v","v"]]
 },
 seguir:{

 options:[["bro pk o que.-.","pk"],["awwbhermoso gracias ","gracias"]]
 },
 v:{
 title:"",subtitle:"",message:"bro q te pasa",
 options:[["bro pk o que.-.","pk"],["awwbhermoso gracias ","gracias"]]
 },
 pk:{
 title:"",subtitle:"",
 message:"puede que no sepas mucho d mi ni yo de ti pero creo que no hace falta conocerte al mil para saber que erss un buen niño:) ok y lo primero que pensaras es q te acoso pero me di a la tarea de analizar algunas cosas d ti y creo q la persona que este contigo seria muy afortunada, espero q en verdad encuentres a una mujer q te ame tanto como lo mereces y si ya lo hiciste pues k hermoso espero que te sepan valorar mucho y q seas muy feliz uwu",
 options:[]
 },
 gracias:{
 title:"",subtitle:"",
 message:"y bueno hay muchas cosas k quisiera decirte perono te quiero incomodar ni quisiera que me dejes de hablar entonces prefiero ignorar mis pensamientos y asi poder seguir conservando tu amistad uwu",
 options:[["ok","fin"]]
 },
 fin:{title:"",subtitle:"",message:"fin",options:[]}
};

const title=document.getElementById("title");
const subtitle=document.getElementById("subtitle");
const message=document.getElementById("message");
const options=document.getElementById("options");

function show(id){
 const s=screens[id];
 title.textContent=s.title;
 title.style.display=s.title?"block":"none";
 subtitle.textContent=s.subtitle;
 subtitle.style.display=s.subtitle?"block":"none";
 message.textContent=s.message;
 message.style.animation="none";
 void message.offsetWidth;
 message.style.animation="appear .32s ease";
 options.innerHTML="";
 s.options.forEach(([label,next])=>{
 const b=document.createElement("button");
 b.type="button"; b.textContent=label;
 b.addEventListener("click",()=>show(next));
 options.appendChild(b);
 });
 window.scrollTo({top:0,behavior:"smooth"});
}
show("inicio");
</script>
</body>
</html>
